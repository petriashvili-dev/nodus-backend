name: Backend Deploy

# Runs on merge (push) into main: tests first, deployment only if they pass.
on:
  push:
    branches:
      - main

# One deployment at a time; a newer merge waits for the running one instead of cancelling it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    # Integration tests run the real app against PostgreSQL (TestApp creates a database per test class).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nodus
          POSTGRES_PASSWORD: nodus
          POSTGRES_DB: nodus
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U nodus -d nodus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODUS_TEST_POSTGRES: Host=localhost;Port=55432;Username=nodus;Password=nodus;Database=postgres
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Nodus.sln

      - name: Build
        run: dotnet build Nodus.sln --configuration Release --no-restore

      - name: Check migrations match the model
        run: |
          dotnet tool install dotnet-ef --tool-path ./.tools
          ./.tools/dotnet-ef migrations has-pending-model-changes --project Nodus.Api --configuration Release --no-build

      - name: Run tests
        run: >-
          dotnet test Nodus.Tests/Nodus.Tests.csproj --configuration Release --no-build
          --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx

  deploy:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Nodus.Api/Dockerfile
          push: true
          # latest for Dokploy, the commit SHA for rollbacks.
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

      - name: Trigger Dokploy deployment
        run: |
          curl --fail-with-body -X POST "${{ secrets.DOKPLOY_URL }}/api/compose.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -d '{"composeId": "${{ secrets.DOKPLOY_COMPOSE_ID }}"}'
