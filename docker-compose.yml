# Production Docker Swarm Stack (Dokploy: Compose Type = Stack).
# Eatee production server. Fixed image/domain/networks; Dokploy writes Environment to .env.
version: "3.8"

services:
  api:
    image: ghcr.io/petriashvili-dev/nodus-backend:latest
    env_file:
      - .env
    environment: &api-env
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080;http://+:9464
      Database__MigrateOnStartup: "false"
      Observability__MetricsPort: "9464"
      Logging__LogLevel__Microsoft.AspNetCore: Warning
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5m
    networks:
      - edge
      - mail
      - default
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 5m
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 5m
      labels:
        - traefik.enable=true
        - traefik.swarm.network=eatee-proxy
        - traefik.http.routers.nodus-web.rule=Host(`nodus.eatee.ru`)
        - traefik.http.routers.nodus-web.entrypoints=web
        - traefik.http.routers.nodus-web.middlewares=nodus-redirect
        - traefik.http.routers.nodus-web.service=nodus
        - traefik.http.middlewares.nodus-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.nodus-redirect.redirectscheme.permanent=true
        - traefik.http.routers.nodus-secure.rule=Host(`nodus.eatee.ru`)
        - traefik.http.routers.nodus-secure.entrypoints=websecure
        - traefik.http.routers.nodus-secure.tls=true
        - traefik.http.routers.nodus-secure.tls.certresolver=regru
        - traefik.http.routers.nodus-secure.service=nodus
        - traefik.http.services.nodus.loadbalancer.server.port=8080

  # A completed task (0/1 running) is normal. It runs again when the image/spec changes.
  migrate:
    image: ghcr.io/petriashvili-dev/nodus-backend:latest
    command: ["migrate"]
    env_file:
      - .env
    environment: *api-env
    healthcheck:
      disable: true
    networks:
      - default
    stop_grace_period: 40s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: pause

  db:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_DB: nodus
      POSTGRES_USER: nodus
    volumes:
      - nodus_postgres_data:/var/lib/postgresql/data
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 268435456
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nodus", "-d", "nodus"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - default
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.nodus.data == true
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: pause

volumes:
  nodus_postgres_data:
    name: nodus_postgres_data

networks:
  edge:
    external: true
    name: eatee-proxy
  mail:
    external: true
    name: eatee-mail
  default:
    driver: overlay
